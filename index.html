  <body>
    <style>
      body {
        margin: 0;
        background: #f6f1e8;
        color: #171512;
        font-family: Pretendard Variable, Pretendard, system-ui, sans-serif;
      }
      #app:not(.ready)::before {
        content: '한';
        position: fixed;
        left: 50%;
        top: calc(50% - 42px);
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        transform: translate(-50%, -50%);
        background: #171512;
        color: #f6f1e8;
        font-family: Gowun Batang, serif;
        font-size: 25px;
        font-weight: 700;
      }
      #app:not(.ready)::after {
        content: 'Loading study data...';
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, 0);
        color: #6f675d;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .boot-error {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 28px;
        text-align: center;
      }
      .boot-mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #171512;
        color: #f6f1e8;
        font-family: Gowun Batang, serif;
        font-size: 26px;
        font-weight: 700;
      }
      .boot-error h1 {
        margin: 8px 0 0;
        font-family: Gowun Batang, serif;
        font-size: 30px;
        line-height: 1.1;
      }
      .boot-error p {
        max-width: 430px;
        margin: 0;
        color: #6f675d;
        line-height: 1.55;
      }
      .boot-retry {
        margin-top: 8px;
        padding: 11px 18px;
        border: 0;
        border-radius: 8px;
        background: #171512;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .boot-error small {
        max-width: min(520px, 90vw);
        color: #8f8578;
        word-break: break-word;
      }
    </style>
    <div id="app"></div>
  </body>
