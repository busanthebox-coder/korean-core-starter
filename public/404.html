<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Korean Core Starter</title>
    <script>
      (() => {
        const base = '/korean-core-starter/';
        const path = window.location.pathname;
        const route = path.startsWith(base) ? path.slice(base.length) : path.replace(/^\/+/, '');
        const cleanRoute = route.replace(/^\/+|\/+$/g, '');
        const query = window.location.search || '';
        const hash = cleanRoute ? `#/${cleanRoute}${query}` : '#/';
        window.location.replace(`${base}${hash}`);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Korean Core Starter...</p>
  </body>
</html>
